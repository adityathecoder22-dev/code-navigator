services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      ORDER_SERVICE_URL: http://order-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8081
      JWT_SECRET: change-me
    depends_on:
      - order-service
      - inventory-service

  order-service:
    build: ./order-service
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/orders
      PAYMENT_SERVICE_URL: http://payment-service:9000
      INVENTORY_SERVICE_URL: http://inventory-service:8081
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      - postgres
      - kafka
      - payment-service
      - inventory-service

  payment-service:
    build: ./payment-service
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      PAYMENT_PROVIDER_URL: https://api.payments.example.com
      PAYMENT_TIMEOUT_MS: "3000"
    depends_on:
      - kafka
      - redis

  inventory-service:
    build: ./inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka

  notification-service:
    build: ./notification-service
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SMTP_HOST: mailhog
    depends_on:
      - kafka

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop

  kafka:
    image: bitnami/kafka:3.7

  redis:
    image: redis:7
